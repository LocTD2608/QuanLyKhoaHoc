services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sci_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-sci_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sci_management}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sci_network

  # ----------------------------------------------------------------------------
  # 2. Qdrant Vector Database (For RAG AI Chatbot)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sci_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - sci_network

  # ----------------------------------------------------------------------------
  # 3. Backend (FastAPI Application)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sci_backend
    restart: always
    environment:
      ENV: production
      HOST: 0.0.0.0
      PORT: 10000
      DB_TYPE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-sci_management}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-sci-management-production-secret-2026}
    volumes:
      - ./backend/data:/app/data
      - ./backend/reports:/app/reports
    ports:
      - "10000:10000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - sci_network

  # ----------------------------------------------------------------------------
  # 4. Frontend (React + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sci_frontend
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - sci_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  sci_network:
    driver: bridge
